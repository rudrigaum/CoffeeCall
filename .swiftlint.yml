# Coffee Call - SwiftLint Configuration

# Directories excluded from linting.
excluded:
  - .build
  - DerivedData
  - Pods
  - Carthage

# Maximum line length.
line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

# Maximum type body length.
type_body_length:
  warning: 250
  error: 350

# Maximum file length.
file_length:
  warning: 400
  error: 500

# Reporter optimized for Xcode diagnostics.
reporter: xcode
